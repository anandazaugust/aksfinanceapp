apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sqlsecretclass
  namespace: backend
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: adf095de-586c-4074-a137-8a74865090cd
    keyvaultName: dolcegabbana
    cloudName: ""
    objects: |
      array:
        - |
          objectName: SQL-CONNECTION
          objectType: secret
          objectVersion: ""
    tenantId: 17a09c66-f406-4897-8b24-51f5313623dc

  secretObjects:
    - secretName: SQL-CONNECTION
      type: Opaque
      data:
        - key: SQL_CONNECTION_KEY
          objectName: SQL-CONNECTION
